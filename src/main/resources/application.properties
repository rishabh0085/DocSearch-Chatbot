spring.application.name=enterprise-search

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/enterprise_search
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.file.upload-dir=uploads

# ===============================
# Document Chunking
# ===============================
app.document.chunk-size=1000
app.document.chunk-overlap=100

# ===============================
# Ollama Embeddings
# ===============================
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text
ollama.llm-model=llama3.2:3b
# Keeps the 3B model resident only for this bounded interval. It improves warm
# requests but consumes RAM while resident; set 0 or a shorter duration on constrained hosts.
ollama.llm.keep-alive=10m
ollama.llm.max-output-tokens=192

# ===============================
# Retrieval-Augmented Generation
# ===============================
rag.max-context-chunks=5
rag.evaluation.top-k=5
# Similarity is 1 - cosine distance. This threshold was derived from real pgvector
# score separation for the current indexed corpus (11I-C).
rag.relevance.min-similarity=0.65
